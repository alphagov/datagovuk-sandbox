name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'application/**'
      - 'scripts/**'
      - 'docker/**'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC token exchange
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REGISTRY: 525320085442.dkr.ecr.eu-west-2.amazonaws.com
  ECR_REPOSITORY: datagovuk-sandbox
  ECS_CLUSTER: test
  ECS_SERVICE: datagovuk-sandbox
  CONTAINER_NAME: app

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::525320085442:role/github-actions-deployer-test
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image to ECR
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
               --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$IMAGE_TAG" \
               --region "$AWS_REGION" \
               > /dev/null 2>&1; then
            echo "Image $IMAGE_TAG already exists in ECR, skipping build and push."
          else
            docker build \
              --file docker/Dockerfile \
              --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
              .
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          fi
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE }} \
            --query taskDefinition \
            > task-definition.json

      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Set deployed image
        run: |
          aws ssm put-parameter \
            --name "/test/${{ env.ECS_SERVICE }}/image" \
            --type String \
            --value "${{ steps.build-image.outputs.image }}" \
            --overwrite

