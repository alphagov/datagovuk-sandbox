services:
  opensearch:
    image: opensearchproject/opensearch:3.5.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - local-network

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "5050:5050"
    env_file:
      - .flaskenv
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      # The app always signs OpenSearch requests (SigV4). The local container has
      # security disabled and ignores the signature so use dummy values
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_REGION=eu-west-2
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      - opensearch
    networks:
      - local-network

networks:
  local-network:
    driver: bridge

volumes:
  opensearch_data:
