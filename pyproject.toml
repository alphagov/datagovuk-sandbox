[project]
name = "datagovuk-data-prototype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click",
    "python-slugify",
    "playwright",
    "jinja2>=3.1.6",
    "flask>=3.1.3",
    "python-dotenv>=1.2.2",
    "gunicorn>=26.0.0",
    "python-frontmatter>=1.1.0",
    "opensearch-py>=3.1.0",
    "markdown>=3.10.2",
    "python-markdown>=0.1.0",
    "boto3>=1.40.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.8",
]


[tool.ruff]
exclude = ["scripts/restore-ckan-db.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["application"]
